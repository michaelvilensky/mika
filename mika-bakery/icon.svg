<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="55%" stop-color="#fab1a0"/>
      <stop offset="100%" stop-color="#fd79a8"/>
    </linearGradient>
    <radialGradient id="frosting" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffe0eb"/>
      <stop offset="100%" stop-color="#ff9bb8"/>
    </radialGradient>
    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0703a"/>
      <stop offset="100%" stop-color="#6b4423"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="180" height="180" rx="40" ry="40" fill="url(#bg)"/>

  <!-- decorative sparkles -->
  <g fill="#fff" opacity="0.55">
    <circle cx="28" cy="32" r="3"/>
    <circle cx="155" cy="40" r="2.5"/>
    <circle cx="148" cy="142" r="3.5"/>
    <circle cx="32" cy="148" r="2.5"/>
  </g>

  <!-- cupcake wrapper (trapezoid) -->
  <path d="M 60 110 L 120 110 L 130 162 L 50 162 Z" fill="url(#wrap)" stroke="#5c3a1e" stroke-width="2.5"/>

  <!-- wrapper vertical stripes -->
  <g stroke="#5c3a1e" stroke-width="1.5" opacity="0.45">
    <line x1="72" y1="110" x2="68" y2="162"/>
    <line x1="90" y1="110" x2="90" y2="162"/>
    <line x1="108" y1="110" x2="112" y2="162"/>
  </g>

  <!-- frosting (cloud-like swirl) -->
  <path d="M 55 110
           C 50 90, 70 75, 80 85
           C 85 65, 115 65, 120 85
           C 135 75, 145 95, 130 110 Z"
        fill="url(#frosting)" stroke="#c44569" stroke-width="2"/>

  <!-- cherry on top -->
  <circle cx="92" cy="58" r="9" fill="#e63946" stroke="#8b1a25" stroke-width="1.5"/>
  <ellipse cx="89" cy="55" rx="2.5" ry="1.8" fill="#fff" opacity="0.7"/>
  <!-- cherry stem -->
  <path d="M 92 50 Q 96 38 104 36" stroke="#3a7a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="104" cy="36" rx="4" ry="2" fill="#4d9e3a" transform="rotate(30 104 36)"/>

  <!-- sprinkles on frosting -->
  <g stroke-width="2" stroke-linecap="round">
    <line x1="68" y1="100" x2="71" y2="103" stroke="#74b9ff"/>
    <line x1="115" y1="98" x2="118" y2="95" stroke="#fdcb6e"/>
    <line x1="100" y1="100" x2="104" y2="102" stroke="#a29bfe"/>
    <line x1="80" y1="95" x2="82" y2="92" stroke="#55efc4"/>
  </g>
</svg>
