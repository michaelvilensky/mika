# Netlify config for mika-bakery (monorepo: only deploy this subfolder)
# NOTE: Both `publish` and `ignore` are interpreted relative to `base`.
# We pin base = "." (repo root) here so that any leftover base value in the
# Netlify UI is overridden — toml beats UI.
[build]
  base      = "."
  publish   = "mika-bakery"
  functions = "netlify/functions"
  # Skip the deploy unless something deployable changed: the site itself,
  # the serverless functions, this toml, or root package files.
  # `git diff --quiet` exits 0 (skip) when ALL listed paths are unchanged.
  ignore    = "git diff --quiet HEAD^ HEAD -- mika-bakery/ netlify/ netlify.toml package.json package-lock.json"

[build.environment]
  # No build step — pure static site.
  NODE_VERSION = "20"

# Long-lived cache for static assets that rarely change.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Don't cache index.html — we want updates to land immediately on refresh.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
