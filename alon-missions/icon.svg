<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#b3e5fc"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="70%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
  </defs>

  <!-- sky background -->
  <rect x="0" y="0" width="180" height="180" rx="38" ry="38" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="36" cy="38" r="20" fill="url(#sun)"/>
  <g stroke="#ffeb3b" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="36" y1="10" x2="36" y2="16"/>
    <line x1="36" y1="60" x2="36" y2="66"/>
    <line x1="8" y1="38" x2="14" y2="38"/>
    <line x1="58" y1="38" x2="64" y2="38"/>
    <line x1="16" y1="18" x2="20" y2="22"/>
    <line x1="52" y1="54" x2="56" y2="58"/>
    <line x1="16" y1="58" x2="20" y2="54"/>
    <line x1="52" y1="22" x2="56" y2="18"/>
  </g>

  <!-- decoration stars -->
  <polygon points="155,28 158,36 166,36 160,41 162,49 155,44 148,49 150,41 144,36 152,36" fill="#fff" opacity="0.95"/>
  <polygon points="148,108 150,113 156,113 151,116 153,121 148,118 143,121 145,116 140,113 146,113" fill="#fff" opacity="0.85"/>
  <polygon points="22,118 24,123 30,123 25,126 27,131 22,128 17,131 19,126 14,123 20,123" fill="#fff" opacity="0.85"/>

  <!-- road -->
  <rect x="0" y="154" width="180" height="26" fill="#37474f"/>
  <g stroke="#fff" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" opacity="0.85">
    <line x1="6" y1="166" x2="174" y2="166"/>
  </g>

  <!-- car body lower -->
  <rect x="28" y="100" width="124" height="42" rx="11" ry="11" fill="url(#car)" stroke="#0d47a1" stroke-width="2"/>
  <!-- car cabin (upper) -->
  <path d="M 52 102 L 62 76 L 118 76 L 128 102 Z" fill="url(#car)" stroke="#0d47a1" stroke-width="2"/>
  <!-- windshield -->
  <path d="M 64 98 L 71 81 L 109 81 L 116 98 Z" fill="#b3e5fc" stroke="#0d47a1" stroke-width="1.5"/>
  <!-- window split -->
  <line x1="90" y1="81" x2="90" y2="98" stroke="#0d47a1" stroke-width="1.5"/>

  <!-- light bar (police/hero) -->
  <rect x="68" y="65" width="44" height="11" rx="3" ry="3" fill="#212121"/>
  <rect x="70" y="67" width="20" height="7" rx="1.5" ry="1.5" fill="#ef5350"/>
  <rect x="90" y="67" width="20" height="7" rx="1.5" ry="1.5" fill="#42a5f5"/>

  <!-- 123 plate -->
  <rect x="55" y="116" width="70" height="20" rx="5" ry="5" fill="#fff8d0" stroke="#ffb300" stroke-width="2"/>
  <text x="90" y="131" text-anchor="middle" font-family="'Heebo', 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#0d47a1" letter-spacing="2">1 2 3</text>

  <!-- wheels -->
  <circle cx="55" cy="148" r="15" fill="#212121"/>
  <circle cx="55" cy="148" r="7" fill="#9e9e9e"/>
  <circle cx="55" cy="148" r="3" fill="#424242"/>
  <circle cx="125" cy="148" r="15" fill="#212121"/>
  <circle cx="125" cy="148" r="7" fill="#9e9e9e"/>
  <circle cx="125" cy="148" r="3" fill="#424242"/>

  <!-- tiny paw print bottom-right (Paw Patrol nod) -->
  <g fill="#fff" opacity="0.85" transform="translate(155, 145)">
    <ellipse cx="0" cy="3" rx="5" ry="5.5"/>
    <ellipse cx="-6" cy="-3" rx="2" ry="2.5"/>
    <ellipse cx="-2" cy="-7" rx="2" ry="2.5"/>
    <ellipse cx="3" cy="-7" rx="2" ry="2.5"/>
    <ellipse cx="7" cy="-3" rx="2" ry="2.5"/>
  </g>
</svg>
